[package]
name = "gmuxd"
version = "0.1.0"
edition = "2024"
description = "Headless gmux multiplexer server (gmuxd)"
publish = false

[dependencies]
crossterm = "0.28"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ulid = "1"
unicode-width = "0.2"
vte = "0.15"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
